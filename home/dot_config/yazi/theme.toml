# =============================================================================
# Yazi — Gruvbox Dark Theme
# =============================================================================

[status]
# Normal mode
separator_open = ""
separator_close = ""
separator_style = { fg = "#3c3836", bg = "#1d2021" }

# Modes
mode_normal = { fg = "#1d2021", bg = "#fabd2f", bold = true }
mode_select = { fg = "#1d2021", bg = "#fe8019", bold = true }
mode_unset = { fg = "#1d2021", bg = "#a89984", bold = true }

# Progress
progress_label = { fg = "#ebdbb2", bg = "#3c3836" }
progress_normal = { fg = "#fabd2f", bg = "#3c3836" }

# Permissions
permissions_t = { fg = "#fabd2f" }
permissions_r = { fg = "#b8bb26" }
permissions_w = { fg = "#fb4934" }
permissions_x = { fg = "#83a598" }
permissions_s = { fg = "#d3869b" }

[mgr]
# Preview
preview_hovered = { fg = "#ebdbb2", bg = "#3c3836" }

# Tabs
tab_active = { fg = "#1d2021", bg = "#fabd2f", bold = true }
tab_inactive = { fg = "#a89984", bg = "#282828" }
tab_width = 1

# Borders
border_style = { fg = "#504945" }
border_symbol = "│"

# Synthesis
synt_dir = { fg = "#83a598", bold = true }
synt_exec = { fg = "#b8bb26", bold = true }
synt_link = { fg = "#8ec07c", bold = true }
synt_socket = { fg = "#d3869b" }
synt_pipe = { fg = "#d3869b" }
synt_block = { fg = "#fe8019" }
synt_char = { fg = "#fe8019" }
synt_other = { fg = "#ebdbb2" }

# Selection
selected = { fg = "#fabd2f", underline = true }
cut = { fg = "#fb4934", underline = true }

# Find
find_key = { fg = "#b8bb26", bold = true }
find_pos = { fg = "#1d2021", bg = "#fabd2f" }

# Highlight
hovered = { fg = "#ebdbb2", bg = "#3c3836" }

[header]
header_style = { fg = "#a89984", bg = "#1d2021" }
header_suffix = { fg = "#a89984", bg = "#1d2021" }

[which]
cols = 2
mask = { bg = "#1d2021" }
cands = { fg = "#ebdbb2", bg = "#282828" }
cands_active = { fg = "#fabd2f", bg = "#3c3836" }
rest = { fg = "#a89984" }
separator = "  ➜  "

[help]
on = { fg = "#ebdbb2", bg = "#282828" }
run = { fg = "#a89984" }
desc = { fg = "#83a598" }
footer = { fg = "#a89984", bg = "#1d2021" }

[input]
border = { fg = "#fabd2f" }
title = { fg = "#b8bb26" }
value = { fg = "#ebdbb2", bg = "#282828" }
selected = { fg = "#1d2021", bg = "#fabd2f" }

[select]
border = { fg = "#fabd2f" }
active = { fg = "#1d2021", bg = "#b8bb26" }
inactive = { fg = "#ebdbb2", bg = "#3c3836" }

[notify]
title_info = { fg = "#8ec07c" }
title_warn = { fg = "#fabd2f" }
title_error = { fg = "#fb4934" }
icon_info = { fg = "#8ec07c" }
icon_warn = { fg = "#fabd2f" }
icon_error = { fg = "#fb4934" }

[sort]
icon = { fg = "#a89984" }
icon_reverse = { fg = "#a89984" }
