<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <style>
      :root {
        /* Gruvbox Dark Palette */
        --gruv-bg0: #1d2021;
        --gruv-bg1: #282828;
        --gruv-bg2: #32302f;
        --gruv-bg3: #3c3836;
        --gruv-fg0: #fbf1c7;
        --gruv-fg1: #ebdbb2;
        --gruv-fg2: #d5c4a1;
        --gruv-fg4: #bdae93;
        --gruv-gray: #a89984;
        --gruv-red: #fb4934;
        --gruv-green: #b8bb26;
        --gruv-yellow: #fabd2f;
        --gruv-blue: #83a598;
        --gruv-purple: #d3869b;
        --gruv-aqua: #8ec07c;
        --gruv-orange: #fe8019;

        /* Glassmorphism Design Tokens */
        --glass-bg: rgba(40, 40, 40, 0.38);
        --glass-bg-hover: rgba(50, 48, 47, 0.55);
        --glass-border: rgba(235, 219, 178, 0.1);
        --glass-border-focus: rgba(250, 189, 47, 0.45);
        --glass-blur: blur(20px);
        --glass-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.3);

        /* Typography System */
        --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
        --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      ::selection {
        background: rgba(250, 189, 47, 0.3);
        color: var(--gruv-fg0);
      }

      body {
        /* Intentionally transparent background to expose compositor / window blur */
        background: transparent;
        color: var(--gruv-fg1);
        font-family: var(--font-sans);
        font-size: 1rem;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 2.5rem 1.5rem;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Animations & Motion Tokens */
      :root {
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-standard: cubic-bezier(0.2, 0, 0, 1);
      }

      @keyframes dashboardEntrance {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .dashboard-container {
        width: 100%;
        max-width: 980px;
        margin: auto 0;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        animation: dashboardEntrance 450ms var(--ease-out-expo) both;
      }

      /* Frosted Glass Base */
      .glass-card {
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        box-shadow: var(--glass-shadow);
        transition: border-color 180ms var(--ease-standard), box-shadow 180ms var(--ease-standard);
      }

      .glass-card:hover {
        border-color: rgba(235, 219, 178, 0.2);
      }

      /* Header Bar */
      .header-bar {
        padding: 1.25rem 1.75rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1.5rem;
      }

      .time-group {
        display: flex;
        align-items: baseline;
        gap: 0.85rem;
      }

      .clock-display {
        font-family: var(--font-mono);
        font-size: 2.5rem;
        font-weight: 700;
        line-height: 1;
        color: var(--gruv-fg0);
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums lining-nums;
      }

      .date-display {
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--gruv-yellow);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-variant-numeric: tabular-nums;
      }

      .weather-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(235, 219, 178, 0.05);
        border: 1px solid rgba(235, 219, 178, 0.12);
        padding: 0.45rem 1rem;
        border-radius: 9999px;
        font-size: 0.8125rem;
        color: var(--gruv-fg1);
        flex-shrink: 0;
      }

      .weather-temp {
        font-family: var(--font-mono);
        font-weight: 600;
        font-size: 0.8125rem;
        color: var(--gruv-fg0);
        font-variant-numeric: tabular-nums;
      }

      .weather-desc {
        color: var(--gruv-fg4);
        font-size: 0.8125rem;
      }

      /* Search Container */
      .search-box {
        padding: 0.85rem 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.85rem;
        border-radius: 12px;
        transition: border-color 160ms var(--ease-standard), box-shadow 160ms var(--ease-standard);
      }

      .search-box:focus-within {
        border-color: var(--glass-border-focus);
        box-shadow: 0 0 12px rgba(250, 189, 47, 0.2);
      }

      .search-icon {
        color: var(--gruv-yellow);
        font-size: 1rem;
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }

      .search-input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: none;
        outline: none;
        color: var(--gruv-fg0);
        font-size: 1rem;
        line-height: 1.4;
        font-family: var(--font-sans);
        letter-spacing: 0.01em;
      }

      .search-input::placeholder {
        color: var(--gruv-gray);
      }

      .search-badge {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--gruv-fg4);
        background: rgba(235, 219, 178, 0.08);
        border: 1px solid rgba(235, 219, 178, 0.15);
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        line-height: 1;
        flex-shrink: 0;
      }

      /* Widgets Grid */
      .widgets-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1.25rem;
        align-items: stretch;
      }

      @media (min-width: 900px) {
        .widgets-grid {
          grid-template-columns: 1fr 1fr 1.3fr;
        }
      }

      .widget-card {
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        min-height: 250px;
      }

      .widget-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        border-bottom: 1px solid rgba(235, 219, 178, 0.07);
        padding-bottom: 0.65rem;
      }

      .widget-title {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        text-wrap: balance;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .widget-tag {
        font-family: var(--font-mono);
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        padding: 0.2rem 0.55rem;
        border-radius: 9999px;
        line-height: 1;
        flex-shrink: 0;
      }

      /* Status Indicator Dots */
      .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 8px;
      }

      .status-up {
        background: var(--gruv-green);
        border: 1px solid rgba(184, 187, 38, 0.4);
      }

      .status-down {
        background: var(--gruv-red);
        border: 1px solid rgba(251, 73, 52, 0.4);
      }

      .status-checking {
        background: var(--gruv-yellow);
        border: 1px solid rgba(250, 189, 47, 0.4);
      }

      /* List & Content Styles */
      .widget-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        flex: 1;
      }

      .list-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 0.75rem;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.02);
        font-size: 0.8125rem;
        color: var(--gruv-fg1);
        text-decoration: none;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .list-row:hover {
        background: rgba(235, 219, 178, 0.06);
      }

      .list-row a:focus-visible {
        outline: 2px solid var(--gruv-yellow);
        outline-offset: 3px;
        border-radius: 4px;
      }

      .pill-mono {
        font-family: var(--font-mono);
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        padding: 0.18rem 0.45rem;
        border-radius: 4px;
        background: rgba(211, 134, 155, 0.18);
        color: #d3869b;
        border: 1px solid rgba(211, 134, 155, 0.35);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        flex-shrink: 0;
      }

      .news-item {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        padding: 0.6rem 0.75rem;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.02);
        text-decoration: none;
        transition: background 0.15s ease;
      }

      .news-item:hover {
        background: rgba(235, 219, 178, 0.06);
      }

      .news-item:focus-visible {
        outline: 2px solid var(--gruv-aqua);
        outline-offset: 2px;
      }

      .news-title {
        color: var(--gruv-fg1);
        font-size: 0.8125rem;
        line-height: 1.45;
        font-weight: 500;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-wrap: pretty;
      }

      .news-meta {
        font-family: var(--font-mono);
        font-size: 0.6875rem;
        color: var(--gruv-gray);
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
      }

      /* Keyboard Shortcuts Bar */
      .hints-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 0.75rem 1.5rem;
        padding-top: 0.25rem;
        font-size: 0.75rem;
        color: var(--gruv-gray);
        letter-spacing: 0.01em;
      }

      .hint-tag {
        font-family: var(--font-mono);
        font-size: 0.6875rem;
        font-weight: 600;
        color: var(--gruv-fg4);
        background: rgba(235, 219, 178, 0.06);
        border: 1px solid rgba(235, 219, 178, 0.12);
        padding: 0.12rem 0.4rem;
        border-radius: 4px;
        margin-right: 0.3rem;
        line-height: 1;
      }

      @media (max-width: 820px) {
        .widgets-grid {
          grid-template-columns: 1fr;
        }
        .header-bar {
          flex-direction: column;
          align-items: flex-start;
          gap: 1rem;
        }
      }

      /* Reduced Motion Accessibility Path */
      @media (prefers-reduced-motion: reduce) {
        .dashboard-container {
          animation: none;
        }
        .glass-card,
        .search-box,
        .list-row,
        .news-item {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="dashboard-container">
      <!-- Header: Clock & Weather -->
      <section class="glass-card header-bar" id="clock-weather-bar">
        <div class="time-group">
          <span class="clock-display" id="clock">00:00:00</span>
          <span class="date-display" id="date">MONDAY, JAN 01</span>
        </div>
        <div class="weather-pill" id="weather-badge">
          <span id="weather-icon">⛅</span>
          <span class="weather-temp" id="weather-temp">--°C</span>
          <span class="weather-desc" id="weather-desc">Loading weather...</span>
        </div>
      </section>

      <!-- Keyboard Search & Bang Prompt -->
      <section class="glass-card search-box" id="search-container">
        <span class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input
          type="text"
          id="search"
          class="search-input"
          placeholder="Search web or type bang (!gh, !w, !d)..."
          autocomplete="off"
          aria-label="Search web or enter shortcut bang"
          autofocus
        />
        <span class="search-badge">/</span>
      </section>

      <!-- Widgets Grid -->
      <section class="widgets-grid" id="widgets-grid">
        <!-- Widget 1: Service Uptime & Health -->
        <div class="glass-card widget-card" id="services-widget">
          <div class="widget-header">
            <span class="widget-title" style="color: var(--gruv-green);">Services</span>
            <span class="widget-tag" id="services-summary" style="background: rgba(184, 187, 38, 0.15); color: var(--gruv-green);">Checking</span>
          </div>
          <ul class="widget-list" id="services-list">
            <li class="list-row"><span style="color: var(--gruv-gray);">Checking services...</span></li>
          </ul>
        </div>

        <!-- Widget 2: Software Release Radar -->
        <div class="glass-card widget-card" id="releases-widget">
          <div class="widget-header">
            <span class="widget-title" style="color: var(--gruv-orange);">Releases</span>
            <span class="widget-tag" id="releases-summary" style="background: rgba(254, 128, 25, 0.15); color: var(--gruv-orange);">Tracked</span>
          </div>
          <ul class="widget-list" id="releases-list">
            <li class="list-row"><span style="color: var(--gruv-gray);">Fetching tags...</span></li>
          </ul>
        </div>

        <!-- Widget 3: Tech & AI News Dispatch -->
        <div class="glass-card widget-card" id="news-widget">
          <div class="widget-header">
            <span class="widget-title" style="color: var(--gruv-aqua);">Tech & AI Dispatch</span>
            <span class="widget-tag" style="background: rgba(142, 192, 124, 0.15); color: var(--gruv-aqua);">Live Feed</span>
          </div>
          <div class="widget-list" id="news-list">
            <div class="news-item"><span style="color: var(--gruv-gray);">Loading headlines...</span></div>
          </div>
        </div>
      </section>

      <!-- Keyboard Shortcuts -->
      <footer class="hints-bar">
        <div><span class="hint-tag">/</span> Focus Search</div>
        <div><span class="hint-tag">!g</span> Google</div>
        <div><span class="hint-tag">!gh</span> GitHub</div>
        <div><span class="hint-tag">!d</span> DuckDuckGo</div>
        <div><span class="hint-tag">!w</span> Wikipedia</div>
      </footer>
    </main>

    <script>
      /**
       * =========================================================================
       * USER CONFIGURATION
       * Customize your city, services to health-ping, and GitHub repos to track.
       * =========================================================================
       */
      const CONFIG = {
        weather: {
          city: "Tashkent",
          latitude: 41.2995,
          longitude: 69.2401
        },
        services: [
          { name: "Home Assistant", url: "http://localhost:8123" },
          { name: "Syncthing", url: "http://localhost:8384" },
          { name: "Vaultwarden", url: "http://localhost:8080" }
        ],
        releases: [
          { name: "Neovim", repo: "neovim/neovim" },
          { name: "Hyprland", repo: "hyprwm/Hyprland" },
          { name: "Ghostty", repo: "ghostty-org/ghostty" }
        ],
        news: {
          maxItems: 4
        }
      };

      /**
       * 1. CLOCK & DATE
       */
      function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        const seconds = String(now.getSeconds()).padStart(2, "0");
        document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds}`;

        const options = {
          weekday: "short",
          month: "short",
          day: "numeric"
        };
        document.getElementById("date").textContent = now.toLocaleDateString("en-US", options).toUpperCase();
      }
      setInterval(updateClock, 1000);
      updateClock();

      /**
       * 2. KEYBOARD & SEARCH ROUTING
       */
      const searchInput = document.getElementById("search");

      document.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
        } else if (e.key === "Escape" && document.activeElement === searchInput) {
          searchInput.blur();
        }
      });

      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const query = searchInput.value.trim();
          if (!query) return;

          // Direct URL and host routing (https://, domain.com, sub.domain.org, localhost:3000)
          const urlPattern = /^(https?:\/\/[^\s]+|localhost(:\d+)?(\/[^\s]*)?|([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(:\d+)?(\/[^\s]*)?)$/i;
          if (urlPattern.test(query)) {
            window.location.href = query.startsWith("http://") || query.startsWith("https://")
              ? query
              : `https://${query}`;
            return;
          }

          // Bang handlers with or without trailing queries
          if (query === "!g" || query.startsWith("!g ")) {
            const term = query.slice(2).trim();
            window.location.href = term ? `https://www.google.com/search?q=${encodeURIComponent(term)}` : "https://www.google.com";
          } else if (query === "!d" || query.startsWith("!d ")) {
            const term = query.slice(2).trim();
            window.location.href = term ? `https://duckduckgo.com/?q=${encodeURIComponent(term)}` : "https://duckduckgo.com";
          } else if (query === "!gh" || query.startsWith("!gh ")) {
            const term = query.slice(3).trim();
            window.location.href = term ? `https://github.com/search?q=${encodeURIComponent(term)}` : "https://github.com";
          } else if (query === "!w" || query.startsWith("!w ")) {
            const term = query.slice(2).trim();
            window.location.href = term ? `https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(term)}` : "https://en.wikipedia.org";
          } else {
            window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
          }
        }
      });

      /**
       * 3. WEATHER (Open-Meteo with localStorage Cache)
       */
      const WMO_CODES = {
        0: { desc: "Clear sky", icon: "☀️" },
        1: { desc: "Mainly clear", icon: "🌤️" },
        2: { desc: "Partly cloudy", icon: "⛅" },
        3: { desc: "Overcast", icon: "☁️" },
        45: { desc: "Fog", icon: "🌫️" },
        48: { desc: "Depositing rime fog", icon: "🌫️" },
        51: { desc: "Light drizzle", icon: "🌧️" },
        53: { desc: "Moderate drizzle", icon: "🌧️" },
        55: { desc: "Dense drizzle", icon: "🌧️" },
        61: { desc: "Slight rain", icon: "🌧️" },
        63: { desc: "Moderate rain", icon: "🌧️" },
        65: { desc: "Heavy rain", icon: "🌧️" },
        71: { desc: "Slight snow", icon: "🌨️" },
        73: { desc: "Moderate snow", icon: "🌨️" },
        75: { desc: "Heavy snow", icon: "❄️" },
        80: { desc: "Rain showers", icon: "🌦️" },
        95: { desc: "Thunderstorm", icon: "⛈️" }
      };

      async function fetchWeather() {
        const cacheKey = "weather_cache";
        const cached = localStorage.getItem(cacheKey);
        const now = Date.now();

        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (now - parsed.timestamp < 15 * 60 * 1000) {
              renderWeather(parsed.data);
              return;
            }
          } catch (e) {}
        }

        try {
          const lat = CONFIG.weather.latitude;
          const lon = CONFIG.weather.longitude;
          const res = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`
          );
          if (!res.ok) throw new Error("Weather request failed");
          const data = await res.json();
          localStorage.setItem(cacheKey, JSON.stringify({ timestamp: now, data }));
          renderWeather(data);
        } catch (err) {
          if (cached) {
            renderWeather(JSON.parse(cached).data);
          } else {
            document.getElementById("weather-desc").textContent = "Weather offline";
          }
        }
      }

      function renderWeather(data) {
        if (!data || !data.current) return;
        const temp = Math.round(data.current.temperature_2m);
        const code = data.current.weather_code;
        const wmo = WMO_CODES[code] || { desc: "Clear", icon: "🌤️" };

        document.getElementById("weather-icon").textContent = wmo.icon;
        document.getElementById("weather-temp").textContent = `${temp}°C`;
        document.getElementById("weather-desc").textContent = `${CONFIG.weather.city} • ${wmo.desc}`;
      }

      /**
       * 4. SERVICES HEALTH / UPTIME CHECKER
       */
      async function checkServicesHealth() {
        const container = document.getElementById("services-list");
        container.innerHTML = "";

        let upCount = 0;
        const total = CONFIG.services.length;

        const results = await Promise.allSettled(
          CONFIG.services.map(async (svc) => {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3500);
            const startTime = performance.now();

            try {
              // no-cors allows testing reachability without triggering browser cross-origin blocks
              await fetch(svc.url, {
                mode: "no-cors",
                signal: controller.signal
              });
              clearTimeout(timeoutId);
              const latency = Math.round(performance.now() - startTime);
              return { name: svc.name, url: svc.url, ok: true, latency };
            } catch (e) {
              clearTimeout(timeoutId);
              return { name: svc.name, url: svc.url, ok: false, latency: null };
            }
          })
        );

        results.forEach((res) => {
          const svc = res.value;
          if (svc.ok) upCount++;

          const li = document.createElement("li");
          li.className = "list-row";
          
          const infoDiv = document.createElement("div");
          infoDiv.style.cssText = "display:flex; align-items:center; min-width:0;";
          
          const dot = document.createElement("span");
          dot.className = `status-dot ${svc.ok ? 'status-up' : 'status-down'}`;
          
          const link = document.createElement(svc.ok ? "a" : "span");
          if (svc.ok) {
            link.href = svc.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.style.cssText = "color:var(--gruv-fg1); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;";
          } else {
            link.style.cssText = "color:var(--gruv-gray); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:not-allowed;";
            link.title = "Service currently unreachable";
          }
          link.textContent = svc.name;
          
          infoDiv.appendChild(dot);
          infoDiv.appendChild(link);
          
          const statusDiv = document.createElement("div");
          statusDiv.style.cssText = "display:flex; align-items:center; gap:6px; flex-shrink:0;";

          if (svc.ok && svc.latency !== null) {
            const latencySpan = document.createElement("span");
            latencySpan.style.cssText = "font-family:var(--font-mono); font-size:0.6875rem; color:var(--gruv-gray); font-variant-numeric:tabular-nums;";
            latencySpan.textContent = `${svc.latency}ms`;
            statusDiv.appendChild(latencySpan);
          }

          const statusText = document.createElement("span");
          statusText.style.cssText = `font-family:var(--font-mono); font-size:0.6875rem; font-weight:600; color:${svc.ok ? 'var(--gruv-green)' : 'var(--gruv-red)'}; font-variant-numeric:tabular-nums;`;
          statusText.textContent = svc.ok ? 'UP' : 'DOWN';
          statusDiv.appendChild(statusText);
          
          li.appendChild(infoDiv);
          li.appendChild(statusDiv);
          container.appendChild(li);
        });

        const summaryBadge = document.getElementById("services-summary");
        if (upCount === total) {
          summaryBadge.textContent = `All ${total} Up`;
          summaryBadge.style.color = "var(--gruv-green)";
          summaryBadge.style.background = "rgba(184, 187, 38, 0.15)";
        } else {
          summaryBadge.textContent = `${upCount}/${total} Up`;
          summaryBadge.style.color = "var(--gruv-yellow)";
          summaryBadge.style.background = "rgba(250, 189, 47, 0.15)";
        }
      }

      /**
       * 5. SOFTWARE RELEASE RADAR (GitHub Latest Releases)
       */
      async function fetchReleases() {
        const cacheKey = "releases_cache";
        const cached = localStorage.getItem(cacheKey);
        const now = Date.now();
        let cachedData = null;

        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            cachedData = parsed.data;
            if (now - parsed.timestamp < 2 * 60 * 60 * 1000) {
              renderReleases(cachedData);
              return;
            }
          } catch (e) {}
        }

        const prevMap = new Map();
        if (Array.isArray(cachedData)) {
          cachedData.forEach((item) => prevMap.set(item.name, item));
        }

        const results = await Promise.allSettled(
          CONFIG.releases.map(async (item) => {
            const res = await fetch(`https://api.github.com/repos/${item.repo}/releases/latest`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return {
              name: item.name,
              tag: data.tag_name || "latest",
              url: data.html_url || `https://github.com/${item.repo}`
            };
          })
        );

        const releasesData = results.map((res, index) => {
          const item = CONFIG.releases[index];
          if (res.status === "fulfilled") {
            return res.value;
          }
          // On rate limit or network fail, preserve previously cached tag if available
          const existing = prevMap.get(item.name);
          return existing || { name: item.name, tag: "latest", url: `https://github.com/${item.repo}` };
        });

        localStorage.setItem(cacheKey, JSON.stringify({ timestamp: now, data: releasesData }));
        renderReleases(releasesData);
      }

      function renderReleases(data) {
        const container = document.getElementById("releases-list");
        container.innerHTML = "";
        data.forEach((item) => {
          const li = document.createElement("li");
          li.className = "list-row";
          
          const link = document.createElement("a");
          link.href = item.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.style.cssText = "color:var(--gruv-fg1); text-decoration:none; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;";
          link.textContent = item.name;
          
          const pill = document.createElement("span");
          pill.className = "pill-mono";
          pill.textContent = item.tag;
          
          li.appendChild(link);
          li.appendChild(pill);
          container.appendChild(li);
        });
      }

      /**
       * 6. TECH & AI NEWS WIRE (Hacker News Algolia API)
       */
      async function fetchNews() {
        const container = document.getElementById("news-list");
        const cacheKey = "news_cache";
        const cached = localStorage.getItem(cacheKey);
        const now = Date.now();

        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (now - parsed.timestamp < 30 * 60 * 1000) {
              renderNews(parsed.data);
              return;
            }
          } catch (e) {}
        }

        try {
          const res = await fetch("https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=15");
          if (!res.ok) throw new Error("News fetch failed");
          const data = await res.json();

          // Pick top items, favoring tech/AI keywords
          const articles = (data.hits || [])
            .filter((h) => h.title)
            .slice(0, CONFIG.news.maxItems)
            .map((h) => ({
              title: h.title,
              url: h.url || `https://news.ycombinator.com/item?id=${h.objectID}`,
              points: h.points || 0,
              time: formatRelativeTime(h.created_at_i)
            }));

          localStorage.setItem(cacheKey, JSON.stringify({ timestamp: now, data: articles }));
          renderNews(articles);
        } catch (e) {
          if (cached) {
            renderNews(JSON.parse(cached).data);
          } else {
            container.innerHTML = '<div class="news-item"><span style="color:var(--gruv-gray);">Failed to load news feed.</span></div>';
          }
        }
      }

      function formatRelativeTime(unixSeconds) {
        if (!unixSeconds) return "";
        const diffHours = Math.floor((Date.now() / 1000 - unixSeconds) / 3600);
        if (diffHours < 1) return "just now";
        if (diffHours === 1) return "1h ago";
        if (diffHours < 24) return `${diffHours}h ago`;
        return `${Math.floor(diffHours / 24)}d ago`;
      }

      function renderNews(articles) {
        const container = document.getElementById("news-list");
        container.innerHTML = "";
        articles.forEach((item) => {
          const a = document.createElement("a");
          a.className = "news-item";
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          
          const titleDiv = document.createElement("div");
          titleDiv.className = "news-title";
          titleDiv.textContent = item.title;
          
          const metaDiv = document.createElement("div");
          metaDiv.className = "news-meta";
          metaDiv.textContent = `${item.points} pts • ${item.time}`;
          
          a.appendChild(titleDiv);
          a.appendChild(metaDiv);
          container.appendChild(a);
        });
      }

      function escapeHTML(str) {
        const p = document.createElement("p");
        p.textContent = str;
        return p.innerHTML;
      }

      // Initialize all widgets
      fetchWeather();
      checkServicesHealth();
      fetchReleases();
      fetchNews();
    </script>
  </body>
