# Starship Prompt — Gruvbox Pixel-Art Edition
format = "$all"

[directory]
style = "bold fg:#83a598"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bold fg:#fe8019"
format = " on [$symbol$branch]($style)"
truncation_length = 20

[git_status]
style = "fg:#fabd2f"
format = '[$all_status$ahead_behind]($style)'
conflicted = " 🏳"
up_to_date = ""
untracked = " ?"
stashed = " 📦"
modified = " !"
staged = " +"
renamed = " »"
deleted = " ✘"

[character]
success_symbol = "[❯](bold fg:#fabd2f)"
error_symbol = "[❯](bold fg:#fb4934)"
vicmd_symbol = "[❮](bold fg:#b8bb26)"

[cmd_duration]
min_time = 1_000
format = " took [$duration](bold fg:#b8bb26)"

[package]
disabled = true

[docker_context]
disabled = true
