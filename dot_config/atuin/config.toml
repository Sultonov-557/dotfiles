# Atuin config
# https://docs.atuin.sh

enter_accept = true
filter_mode = "global"
search_mode = "fuzzy"
style = "compact"
inline_height = 8
show_preview = true

# Match fish's vi-mode (fish_vi_key_bindings in config.fish) so hjkl/Esc
# muscle memory carries into the history-search popup, not just the shell.
keymap_mode = "vim-insert"

[search]
filters = ["global", "host", "session", "directory"]

[stats]
common_prefix = ["sudo"]
ignored_commands = ["cd", "ls", "vi"]

[sync]
records = true
