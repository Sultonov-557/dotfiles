onboarding = false
[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+g"

# Tab operations — direct bindings, no prefix needed (frictionless).
# hjkl to match every other directional binding in this file (pane focus,
# workspace switch) and the system-wide HJKL convention; arrow keys are
# bound alongside as an alternative.
next_tab = ["ctrl+shift+l", "ctrl+shift+right"]
previous_tab = ["ctrl+shift+h", "ctrl+shift+left"]
new_tab = "ctrl+shift+t"
close_tab = "ctrl+shift+w"
rename_tab = "ctrl+shift+r"

# Workspace operations with prefix
workspace_picker = "prefix+w"
previous_workspace = "prefix+shift+h"
next_workspace = "prefix+shift+l"
new_workspace = "prefix+shift+n"
close_workspace = "prefix+shift+d"

# Pane operations with prefix
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"
# Deliberately NOT bound to ctrl+h/j/k/l here. herdr is a multiplexer: it
# intercepts and consumes keys matching its own bindings before they ever
# reach the focused pane's pty, regardless of what's running inside (shell,
# Neovim, anything). A herdr-level ctrl+h binding would swallow the
# keystroke before Neovim's own after/plugin/herdr_nav.lua ever saw it,
# breaking in-Neovim window navigation. (This used to be a
# `[[keys.command]] type = "plugin_action" command = "vim-herdr-navigation.*"`
# referencing a plugin that was never actually installed — errored "plugin
# action not found" every press. Binding it here directly instead would have
# "fixed" the error while re-breaking Neovim nav a different way, so it's
# left unbound: Ctrl+h/j/k/l only works inside Neovim via herdr_nav.lua.)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Navigation mode
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
reload_config = "prefix+shift+r"

# --- herdr.nvim (Rust helper, marker-based — Ctrl+Alt as alt nav)
[[keys.command]]
key = "ctrl+alt+h"
type = "shell"
command = "herdr-navigator dispatch left"

[[keys.command]]
key = "ctrl+alt+j"
type = "shell"
command = "herdr-navigator dispatch down"

[[keys.command]]
key = "ctrl+alt+k"
type = "shell"
command = "herdr-navigator dispatch up"

[[keys.command]]
key = "ctrl+alt+l"
type = "shell"
command = "herdr-navigator dispatch right"

[[keys.command]]
key = "prefix+\\"
type = "shell"
command = "herdr-navigator split right"



# --- herdr-plus plugin bindings
[keys.indexed]
tabs = "ctrl"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[ui]
agent_panel_sort = "priority"
